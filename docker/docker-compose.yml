services:
  # PostgreSQL database
  postgres:
    image: postgres:17
    container_name: onlineshop-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      # Persistent PostgreSQL data
      - onlineshop-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - onlineshop-network

  # Run Prisma database migrations before the local backend starts
  # Uses the locally built backend image
  migration:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: onlineshop-backend:dev
    container_name: onlineshop-migration
    restart: "no"

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

    command: npx prisma migrate deploy

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - onlineshop-network

  # Build backend image locally from source
  backend:
    # Local image build
    build:
      context: ../backend
      dockerfile: Dockerfile
    # Locally built image tag
    image: onlineshop-backend:dev
    container_name: onlineshop-backend

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5050
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: http://localhost:5173

    ports:
      - "5050:5050"

    volumes:
      # Persistent product image uploads
      - onlineshop-backend-uploads:/app/uploads

    depends_on:
      migration:
        condition: service_completed_successfully

    networks:
      - onlineshop-network

  # Build frontend image locally from source
  frontend:
    # Local image build
    build:
      context: ../frontend
      dockerfile: Dockerfile
    # Locally built image tag
    image: onlineshop-frontend:dev
    container_name: onlineshop-frontend

    restart: unless-stopped

    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:5050}

    ports:
      - "5173:80"

    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      backend:
        condition: service_started

    networks:
      - onlineshop-network

# Named volumes survive container recreation
volumes:
  onlineshop-postgres-data:
  onlineshop-backend-uploads:

# Dedicated application network
networks:
  onlineshop-network:
    driver: bridge