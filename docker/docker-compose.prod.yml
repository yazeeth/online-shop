services:
  postgres:
    image: postgres:17
    container_name: onlineshop-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - onlineshop-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: yazeeth/onlineshop-backend:${BACKEND_VERSION}
    container_name: onlineshop-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5050
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: http://localhost:5173

    ports:
      - "5050:5050"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: yazeeth/onlineshop-frontend:${FRONTEND_VERSION}
    container_name: onlineshop-frontend
    restart: unless-stopped

    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:5050}

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  onlineshop-postgres-data:
