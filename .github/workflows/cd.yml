name: Docker CD

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version (e.g. v1.0.4)"
        required: true
        type: string

jobs:
  docker-publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    env:
      IMAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            yazeeth/onlineshop-backend:${{ env.IMAGE_VERSION }}
            yazeeth/onlineshop-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            yazeeth/onlineshop-frontend:${{ env.IMAGE_VERSION }}
            yazeeth/onlineshop-frontend:latest

      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: yazeeth/online-shop-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update GitOps image versions
        working-directory: gitops
        run: |
          sed -i "s#yazeeth/onlineshop-backend:v[0-9]*\.[0-9]*\.[0-9]*#yazeeth/onlineshop-backend:${IMAGE_VERSION}#g" \
            apps/online-shop/base/backend-deployment.yaml

          sed -i "s#yazeeth/onlineshop-backend:v[0-9]*\.[0-9]*\.[0-9]*#yazeeth/onlineshop-backend:${IMAGE_VERSION}#g" \
            apps/online-shop/base/backend-migration-job.yaml

          sed -i "s#yazeeth/onlineshop-frontend:v[0-9]*\.[0-9]*\.[0-9]*#yazeeth/onlineshop-frontend:${IMAGE_VERSION}#g" \
            apps/online-shop/base/frontend-deployment.yaml

      - name: Verify GitOps image versions
        working-directory: gitops
        run: |
          echo "Image version: ${IMAGE_VERSION}"
          grep -R "image:" apps/online-shop/base

      - name: Commit and push GitOps changes
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            apps/online-shop/base/backend-deployment.yaml \
            apps/online-shop/base/backend-migration-job.yaml \
            apps/online-shop/base/frontend-deployment.yaml

          if git diff --cached --quiet; then
            echo "No GitOps image changes detected."
            exit 0
          fi

          git commit -m "update online-shop images to ${IMAGE_VERSION}"
          git push origin main